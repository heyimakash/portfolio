<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent — Akash Chowdhury</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .thanks-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .thanks-card {
      max-width: 480px;
      padding: 3rem 2.5rem;
      background: rgba(28,35,51,0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(99,102,241,0.18);
      border-radius: 20px;
    }
    .thanks-icon { font-size: 4rem; margin-bottom: 1rem; display: block; }
    .thanks-title {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }
    .thanks-body {
      color: #8b949e;
      font-size: 1rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      background: linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4);
      color: white;
      box-shadow: 0 4px 15px rgba(99,102,241,0.35);
      transition: all 0.3s ease;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
    }
    .back-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.5); }
    .countdown { font-size: 0.8rem; color: #484f58; margin-top: 1rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo">AC.</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="experience.html">Experience</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="contact.html" class="btn-contact">Contact Me</a></li>
    </ul>
  </nav>

  <div class="thanks-wrap">
    <div class="thanks-card">
      <span class="thanks-icon">✅</span>
      <div class="thanks-title">Message Sent!</div>
      <p class="thanks-body">
        Thank you for reaching out, <strong style="color:#f0f6fc;">Akash</strong> will get back to you
        within 24 hours. In the meantime, feel free to explore the portfolio.
      </p>
      <a href="index.html" class="back-btn">← Back to Portfolio</a>
      <div class="countdown" id="countdown">Redirecting in <span id="sec">5</span>s…</div>
    </div>
  </div>

  <script>
    let s = 5;
    const el = document.getElementById('sec');
    const t = setInterval(() => {
      s--;
      if (el) el.textContent = s;
      if (s <= 0) { clearInterval(t); window.location.href = 'index.html'; }
    }, 1000);
  </script>
</body>
</html>
